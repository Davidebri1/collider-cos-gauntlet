<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><script src="gauntlet-data.js"></script></head>
<body>
<script>
"use strict";
const main = shell("Head-to-Head Vote", "Superior entries are paired randomly; the jury (your peers) decides by popular vote with reasons (§7.2–7.3).");

main.innerHTML = `
  <div class="panel">
    <div class="row">${selRound()}
      <div><label>Voter (peer juror)</label><select id="voter">${COMPETITORS.map(c => `<option value="${c.n}">${c.label}</option>`).join("")}</select></div>
    </div>
    <div class="row">
      <div><label>Pairing A</label><select id="a">${COMPETITORS.map(c => `<option value="${c.n}">${c.label}</option>`).join("")}</select></div>
      <div><label>Pairing B</label><select id="b">${COMPETITORS.map(c => `<option value="${c.n}">${c.label}</option>`).join("")}</select></div>
    </div>
    <label>Vote for</label>
    <select id="for"><option value="a">Pairing A</option><option value="b">Pairing B</option></select>
    <label>Reasons (required — your vote is graded, court-of-law standard)</label>
    <textarea id="rationale" placeholder="Concrete, logical justification. Baseless conjecture, illogical claims, or misplaced requirements are flagged and cost your final score."></textarea>
    <div style="margin-top:12px"><button id="save">Cast Jury Vote</button></div>
  </div>
  <h2>Jury votes this round</h2>
  <div class="panel" id="list"></div>
  <div style="display:flex;gap:8px"><button class="ghost" id="expall">Export round head-to-head votes JSON</button></div>
`;

function pairKey(a, b) { return [a, b].sort((x, y) => x - y).join("-"); }

function renderList() {
  const r = getRound();
  const votes = allEntries(`g:r${r}:h2h:`);
  if (votes.length === 0) { document.getElementById("list").innerHTML = `<span class="muted">No votes yet for round ${r}.</span>`; return; }
  const pairs = {};
  votes.forEach(v => {
    const k = pairKey(v.a, v.b);
    pairs[k] = pairs[k] || { a: v.a, b: v.b, aVotes: 0, bVotes: 0, n: 0 };
    pairs[k][v.votedFor === v.a ? "aVotes" : "bVotes"]++;
    pairs[k].n++;
  });
  document.getElementById("list").innerHTML = Object.values(pairs).map(p => {
    const winner = p.aVotes === p.bVotes ? null : (p.aVotes > p.bVotes ? p.a : p.b);
    return `<table style="margin-bottom:10px"><tr>
        <th>${compLabel(p.a)} ${winner === p.a ? "— WINNER" : ""}</th><th>draw</th><th>${compLabel(p.b)} ${winner === p.b ? "— WINNER" : ""}</th></tr>
        <tr class="${winner ? "win" : ""}"><td style="font-size:20px;font-weight:700">${p.aVotes}</td><td class="muted">of ${p.n}</td><td style="font-size:20px;font-weight:700">${p.bVotes}</td></tr>
      </table>`;
  }).join("") + `<table><tr><th>Voter</th><th>Vote</th><th>Reasons</th><th></th></tr>${
      votes.map(v => `<tr><td>${compLabel(v.voter)}</td><td>${compLabel(v.votedFor)}</td><td class="muted" style="max-width:320px">${v.rationale}</td>
        <td><button class="ghost" data-del="${v.key}">✕</button></td></tr>`).join("")}</table>`;
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { deleteEntry(b.dataset.del); renderList(); });
}

document.getElementById("save").onclick = () => {
  const r = getRound(), voter = Number(document.getElementById("voter").value);
  const a = Number(document.getElementById("a").value), b = Number(document.getElementById("b").value);
  if (a === b) { alert("A and B must be different competitors."); return; }
  const rationale = document.getElementById("rationale").value.trim();
  if (rationale.length < 20) { alert("Reasons required (at least a couple of sentences). Baseless votes get flagged."); return; }
  saveEntry(r, "h2h", voter, {
    round: r, voter, a, b, votedFor: document.getElementById("for").value === "a" ? a : b,
    rationale, ts: Date.now(),
  });
  renderList();
};
document.getElementById("round").onchange = renderList;
document.getElementById("expall").onclick = () => {
  const r = getRound();
  downloadJSON({ round: r, kind: "h2hVotes", entries: allEntries(`g:r${r}:h2h:`) }, `round-${r}-h2h-votes.json`);
};
renderList();
</script>
</body>
</html>
